<a href="{% url url %}" class="flex items-center gap-3 px-3 py-2.5 rounded-full {% if active == key %}bg-ink text-white font-medium{% else %}text-ink/80 hover:bg-white/60{% endif %}">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">{{ icon|safe }}</svg>
  {{ label }}
</a>

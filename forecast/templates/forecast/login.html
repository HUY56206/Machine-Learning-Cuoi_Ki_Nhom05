{% extends 'forecast/base.html' %}
{% load static %}
{% block scripts %}<script>window.QSR_ACCOUNTS = {{ accounts_json|safe }};</script>{% endblock %}
{% block title %}Đăng nhập · QSR Forecast{% endblock %}

{% block body %}
<div class="min-h-screen bg-gradient-to-br from-[#EEF3F1] to-[#DDE7E7] p-6 flex">
  <section class="hidden md:flex flex-col justify-between bg-mint rounded-[32px] w-[38%] max-w-[560px] px-14 py-14">
    <h1 class="text-[28px] leading-9 text-ink">
      <span class="font-light">Dự báo nhu cầu</span><br>
      <span class="font-bold">Quản lý tồn kho</span>
    </h1>
    <img src="{% static 'forecast/img/login-burger.png' %}" alt="Burger" class="w-[78%] rounded-3xl object-cover">
    <div></div>
  </section>

  <section class="flex-1 grid place-items-center">
    <form method="post" data-submit="login-submit" action="{% url 'forecast:login' %}" class="bg-white rounded-3xl shadow-sm w-full max-w-[410px] p-8">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <h2 class="text-center text-xl font-medium mb-6">Đăng nhập</h2>

      <label for="username" class="block text-sm text-ink/70 mb-2">Tên đăng nhập</label>
      <div class="relative mb-5">
        <select id="username" name="username" data-choice="accounts" class="appearance-none w-full h-11 rounded-xl border-2 border-ink px-4 text-sm bg-white focus:outline-none">
          {% for a in accounts %}<option value="{{ a.value }}">{{ a.value }}</option>{% endfor %}
        </select>
        <svg class="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
      </div>

      <label for="password" class="block text-sm text-ink/70 mb-2">Mật khẩu</label>
      <input id="password" name="password" type="password" placeholder="Nhập mật khẩu"
             class="w-full h-11 rounded-xl border border-ink/20 px-4 text-sm mb-5 focus:outline-none focus:border-ink">

      <div class="flex items-center justify-between text-sm mb-5">
        <label class="flex items-center gap-2 text-ink/60">
          <input type="checkbox" name="remember" class="w-4 h-4 rounded border-ink/30">
          Ghi nhớ đăng nhập
        </label>
        <a href="#" data-act="reset-pw" class="font-medium text-forest">Cấp lại mật khẩu</a>
      </div>

      <button type="submit" class="w-full h-12 rounded-full bg-ink text-white text-sm font-medium flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
        Đăng nhập
      </button>
    </form>
  </section>
</div>
{% endblock %}
